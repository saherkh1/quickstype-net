name: spike-runner-check
on: [workflow_dispatch]

jobs:
  runner-availability:
    strategy:
      matrix:
        runner: [macos-14, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: echo "Runner alive on ${{ matrix.runner }}"
      - run: uname -a || systeminfo
