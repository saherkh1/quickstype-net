name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scanners
        run: brew install gitleaks trufflehog

      - name: Gitleaks full-history scan
        run: gitleaks detect --source . --log-opts="--all" --redact --config=.gitleaks.toml

      - name: TruffleHog verified-secret full-history scan
        run: trufflehog git "file://$PWD" --only-verified --fail
